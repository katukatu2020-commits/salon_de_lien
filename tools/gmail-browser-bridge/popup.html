<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Salon de Lien 予約連携</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span>L</span><div><strong>Salon de Lien</strong><small>Gmail予約連携</small></div></div>
      <section>
        <div class="status-row"><span id="indicator"></span><strong id="status">確認中</strong></div>
        <p id="detail">連携状態を確認しています。</p>
        <dl>
          <div><dt>新規</dt><dd id="imported">0件</dd></div>
          <div><dt>更新</dt><dd id="updated">0件</dd></div>
          <div><dt>失敗</dt><dd id="failed">0件</dd></div>
        </dl>
      </section>
      <button id="sync" type="button">今すぐ確認</button>
      <button id="rescan" type="button" class="secondary">全件を再確認</button>
      <p class="privacy">かんざし結の予約メールだけを読み取り、メール本文やGmailのパスワードは保存しません。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
