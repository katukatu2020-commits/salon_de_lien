name: Deploy campaign booking menu v685

on:
  push:
    branches: [recovery/aws-canonical-20260815]
    paths:
      - .github/workflows/deploy-campaign-booking-v685.yml
      - scripts/aws/runtime-patches/campaign-booking-menu-v685/**
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECR_REPOSITORY: salon-de-lien-staging-app
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  RELEASE_DIR: scripts/aws/runtime-patches/campaign-booking-menu-v685
  PARENT_DIGEST: sha256:09b57c3812dc10eeeff14bc4099369e95f82dc461d746e57863912797af0bb8f
  DEPLOY_FROM_DIGEST: sha256:09b57c3812dc10eeeff14bc4099369e95f82dc461d746e57863912797af0bb8f

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salon
          POSTGRES_PASSWORD: local-test-v679
          POSTGRES_DB: usage_payments_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify protected automation identity
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected deployment identity.' }

      - name: Validate release syntax
        shell: pwsh
        run: |
          Get-ChildItem $env:RELEASE_DIR -File | Where-Object { $_.Extension -in '.js','.mjs','.cjs' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($_.Name)" }
          }

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install registry export tool
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
        with:
          version: v0.22.1

      - name: Resolve and lock the currently running release
        shell: pwsh
        run: |
          $task = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          $definition = aws ecs describe-task-definition --task-definition $task --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          $image = ([string]$web.image).Trim()
          if (-not $task -or -not $image) { throw 'Current release could not be resolved.' }
          if ($image -match '@(sha256:[a-f0-9]{64})$') { $digest = $Matches[1] } else {
            $currentTag = $image.Substring($image.LastIndexOf(':') + 1)
            $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$currentTag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          }
          if ($digest -ne $env:DEPLOY_FROM_DIGEST) { throw "Production moved from reviewed release: $image ($digest)." }
          "PREVIOUS_TASK=$task" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_IMAGE=$image" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_DIGEST=$digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify immutable child image
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "campaign-booking-v685-$shortSha"
          $registry = "$($env:AWS_ACCOUNT_ID).dkr.ecr.$($env:AWS_REGION).amazonaws.com"
          $image = "$registry/$($env:ECR_REPOSITORY):$tag"
          $baseImage = "$registry/$($env:ECR_REPOSITORY)@$($env:PARENT_DIGEST)"
          $rootfs = Join-Path $env:RUNNER_TEMP 'salon-v684-rootfs.tar'
          $flatBase = "salon-de-lien-v684-flat:$shortSha"
          crane export $baseImage $rootfs
          if ($LASTEXITCODE -ne 0) { throw 'Base export failed.' }
          docker import --change 'USER nextjs' --change 'ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' --change 'ENV NODE_VERSION=20.20.2' --change 'ENV YARN_VERSION=1.22.22' --change 'ENV NODE_ENV=production' --change 'ENV NEXT_TELEMETRY_DISABLED=1' --change 'WORKDIR /app' --change 'ENTRYPOINT ["lien-entrypoint"]' --change 'CMD ["node","server.js"]' $rootfs $flatBase | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Base import failed.' }
          docker build --build-arg "BASE_IMAGE=$flatBase" --tag $image $env:RELEASE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v684/verify-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime verification failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v685/verify-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Campaign runtime verification failed.' }
          $databaseUrl = 'postgresql://salon:local-test-v679@127.0.0.1:5432/usage_payments_test?schema=public'
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v685/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Campaign integration failed.' }
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v684/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Appointment integration failed.' }
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v679/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Usage fee integration failed.' }
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v682/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Dealer ERP regression failed.' }
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v671/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Existing sales/team regression failed.' }
          docker run --rm --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl $image /tmp/lien-v677/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shared branch contact regression failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v676/verify-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Style regression failed.' }
          docker run --rm --entrypoint node $image /tmp/three-app-qa-v680/verify-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Three-app hydration regression failed.' }
          docker run -d --name platform-console-fixture --network host --entrypoint node -e TEST_DATABASE_URL=$databaseUrl -e KEEP_FIXTURE=1 -e PORT=3191 $image /tmp/lien-v679/integration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser fixture failed to launch.' }
          $ready = $false
          for ($n=0; $n -lt 60; $n++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:3191/platform/login' -TimeoutSec 5
              $logs = docker logs platform-console-fixture 2>&1 | Out-String
              if ($response.StatusCode -eq 200 -and $logs.Contains('Usage-fee fixture ready')) { $ready=$true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { docker logs platform-console-fixture; throw 'Browser fixture not ready.' }
          npm install --prefix /tmp/erp-browser --no-save --ignore-scripts --no-audit playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed.' }
          $env:SMOKE_DEPENDENCIES_PACKAGE = '/tmp/erp-browser/node_modules/playwright-core/package.json'
          $env:CHROME_PATH = '/usr/bin/google-chrome'
          node scripts/aws/runtime-patches/platform-console-v683/browser-regression.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Operator console regression failed.' }
          node scripts/aws/runtime-patches/appointment-datetime-recovery-v684/browser-regression.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Appointment editor browser tests failed.' }
          docker run -d --name campaign-booking-fixture --network host --entrypoint node $image /tmp/lien-v685/browser-fixture.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Campaign browser fixture failed to launch.' }
          $ready = $false
          for ($n=0; $n -lt 30; $n++) {
            try {
              $response = Invoke-WebRequest 'http://127.0.0.1:3192/u/appointments' -TimeoutSec 5
              if ($response.StatusCode -eq 200) { $ready=$true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { docker logs campaign-booking-fixture; throw 'Campaign fixture not ready.' }
          node (Join-Path $env:RELEASE_DIR 'browser-regression.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Campaign booking browser tests failed.' }
          docker stop campaign-booking-fixture | Out-Null
          docker stop platform-console-fixture | Out-Null
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_IMAGE=$image" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish verified image
        shell: pwsh
        run: |
          docker push $env:RELEASE_IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Image push failed.' }
          $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$($env:RELEASE_TAG)" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if (-not $digest -or $digest -eq 'None') { throw 'Release digest not resolved.' }
          "RELEASE_DIGEST=$digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Register application task definition
        shell: pwsh
        run: |
          $newTask = (& ./scripts/aws/register-release-task.ps1 -CurrentTaskDefinition $env:PREVIOUS_TASK -Image $env:RELEASE_IMAGE -Profile '' | Select-Object -Last 1).Trim()
          if (-not $newTask) { throw 'Task definition not registered.' }
          "RELEASE_TASK=$newTask" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Approve and deploy with automatic rollback
        shell: pwsh
        run: |
          & ./scripts/aws/approve-and-deploy-protected-release.ps1 -PreviousTaskDefinitionArn $env:PREVIOUS_TASK -PreviousImage $env:PREVIOUS_IMAGE -PreviousImageDigest $env:PREVIOUS_DIGEST -NewTaskDefinitionArn $env:RELEASE_TASK -NewImage $env:RELEASE_IMAGE -NewImageDigest $env:RELEASE_DIGEST -Profile ''

      - name: Verify production release
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt=0; $attempt -lt 30; $attempt++) {
            try {
              $r = Invoke-WebRequest 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 10 -UseBasicParsing
              $ready = $r.StatusCode -eq 200 -and $r.Headers['X-Lien-Campaign-Booking-Menu'] -eq 'v685' -and $r.Headers['X-Lien-Appointment-Datetime-Recovery'] -eq 'v684' -and $r.Headers['X-Lien-Platform-Console'] -eq 'v683' -and $r.Headers['X-Lien-Partner-Chat'] -eq 'v682' -and $r.Headers['X-Lien-Dealer-Stock-Note'] -eq 'v681' -and $r.Headers['X-Lien-Three-App-QA'] -eq 'v680' -and $r.Headers['X-Lien-Platform-Usage-Payments'] -eq 'v679' -and $r.Headers['X-Lien-Orimia-Store-Directory'] -eq 'v670'
              if ($ready) { break }
            } catch { $ready = $false }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Production readiness did not recover.' }
          node (Join-Path $env:RELEASE_DIR 'production-smoke.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production smoke failed.' }
          $actualTask = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          if ($actualTask -ne $env:RELEASE_TASK) { throw 'ECS release mismatch.' }

      - name: Record approved release lock
        shell: pwsh
        run: |
          $lockPath = 'infrastructure/deployment-protection/staging-lock.json'
          $lock = Get-Content -Raw $lockPath | ConvertFrom-Json
          $lock.taskDefinitionArn = $env:RELEASE_TASK
          $lock.imageUri = $env:RELEASE_IMAGE
          $lock.imageDigest = $env:RELEASE_DIGEST
          $lock.canonicalCommit = $env:GITHUB_SHA
          $lock.runtimePatchId = $env:RELEASE_TAG
          [IO.File]::WriteAllText((Resolve-Path $lockPath), ($lock | ConvertTo-Json -Depth 20) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lockPath
          git commit -m 'chore: record protected runtime release [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"

      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-booking-v685
          path: artifacts/campaign-booking-v685/
          if-no-files-found: ignore
