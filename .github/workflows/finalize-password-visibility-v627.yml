name: Finalize password visibility v627

on:
  push:
    branches:
      - recovery/aws-canonical-20260815
    paths:
      - .github/workflows/finalize-password-visibility-v627.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  EXPECTED_TASK: arn:aws:ecs:ap-northeast-1:009293460979:task-definition/salon-de-lien-staging-web:629
  EXPECTED_IMAGE: 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:password-visibility-v627-c313cbe3b835
  EXPECTED_DIGEST: sha256:d97bc14542ad779a63cf535c6d6fbacbb8047c32875cb60c2d885f9b76078140
  EXPECTED_COMMIT: c313cbe3b83515ebd11efb0e75a65b5850de70e1
  RELEASE_TAG: password-visibility-v627-c313cbe3b835
  RELEASE_DIR: scripts/aws/runtime-patches/password-visibility-v627

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployed release and protection lock
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected AWS deployment identity.' }
          $service = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json).services[0]
          if ($service.taskDefinition -ne $env:EXPECTED_TASK -or $service.runningCount -ne 1 -or $service.pendingCount -ne 0) { throw 'ECS is not stable on the reviewed release.' }
          $definition = aws ecs describe-task-definition --task-definition $env:EXPECTED_TASK --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          if ($web.image -ne $env:EXPECTED_IMAGE) { throw 'The deployed task references an unexpected image.' }
          $digest = (aws ecr describe-images --repository-name salon-de-lien-staging-app --image-ids "imageTag=$env:RELEASE_TAG" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if ($digest -ne $env:EXPECTED_DIGEST) { throw 'The immutable image digest changed.' }
          $stack = (aws cloudformation describe-stacks --stack-name SalonDeLienDeploymentProtection-staging --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json).Stacks[0]
          $parameters = @{}
          foreach ($item in $stack.Parameters) { $parameters[$item.ParameterKey] = $item.ParameterValue }
          if ($parameters.ApprovedTaskDefinitionArn -ne $env:EXPECTED_TASK -or $parameters.ApprovedImage -ne $env:EXPECTED_IMAGE -or $parameters.ApprovedImageDigest -ne $env:EXPECTED_DIGEST) { throw 'The protection stack is not locked to the reviewed release.' }

      - name: Prepare Chromium verification
        shell: pwsh
        run: |
          $chrome = @('/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'A Chromium executable is required for the browser tests.' }
          $browserDependencies = Join-Path $env:RUNNER_TEMP 'lien-browser-smoke-v627-finalize'
          npm install --prefix $browserDependencies --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed.' }
          "SMOKE_DEPENDENCIES_PACKAGE=$(Join-Path $browserDependencies 'package.json')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHROME_PATH=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify login behavior in production
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 15 -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw 'Production readiness is unavailable.' }
          if ($response.Headers['X-Lien-Password-Visibility'] -ne 'v627') { throw 'Password visibility readiness marker is missing.' }
          if ($response.Headers['X-Lien-Style-Detail-Cleanup'] -ne 'v626') { throw 'Parent readiness marker is missing.' }
          $env:SMOKE_BASE_URL = 'https://salon-de-lien.com'
          $env:SCREENSHOT_DIR = 'artifacts/password-visibility-v627/final-production'
          node (Join-Path $env:RELEASE_DIR 'browser-regression.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production password visibility browser test failed.' }

      - name: Record approved release lock
        shell: pwsh
        run: |
          $lockPath = 'infrastructure/deployment-protection/staging-lock.json'
          $lock = Get-Content -Raw $lockPath | ConvertFrom-Json
          if ($lock.taskDefinitionArn -ne 'arn:aws:ecs:ap-northeast-1:009293460979:task-definition/salon-de-lien-staging-web:627') { throw 'The repository lock moved before finalization.' }
          $lock.taskDefinitionArn = $env:EXPECTED_TASK
          $lock.imageUri = $env:EXPECTED_IMAGE
          $lock.imageDigest = $env:EXPECTED_DIGEST
          $lock.canonicalCommit = $env:EXPECTED_COMMIT
          $lock.runtimePatchId = $env:RELEASE_TAG
          [IO.File]::WriteAllText((Resolve-Path $lockPath), ($lock | ConvertTo-Json -Depth 20) + "`n", [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lockPath
          git commit -m 'chore: record protected runtime release [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"

      - name: Preserve browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-visibility-v627-final
          path: artifacts/password-visibility-v627/
          if-no-files-found: ignore
