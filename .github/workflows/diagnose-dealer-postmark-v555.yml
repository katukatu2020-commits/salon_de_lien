name: Diagnose dealer Postmark v555

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/aws-canonical-20260815
    paths:
      - .github/workflows/diagnose-dealer-postmark-v555.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: DealerPostmarkDiagnostics
          aws-region: ap-northeast-1

      - name: Read the latest dealer mail failure
        shell: pwsh
        run: |
          $task = (aws ecs describe-services --cluster salon-de-lien-staging-cluster --services salon-de-lien-staging-web --region ap-northeast-1 --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          $definition = aws ecs describe-task-definition --task-definition $task --region ap-northeast-1 --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          $logGroup = [string]$web.logConfiguration.options.'awslogs-group'
          if (-not $logGroup) { throw 'The Web log group could not be resolved.' }
          $startTime = [DateTimeOffset]::UtcNow.AddMinutes(-20).ToUnixTimeMilliseconds()
          $filterPattern = '"dealer-auth"'
          $payload = aws logs filter-log-events --log-group-name $logGroup --start-time $startTime --filter-pattern $filterPattern --region ap-northeast-1 --output json --no-cli-pager | ConvertFrom-Json
          $messages = @($payload.events | ForEach-Object { [string]$_.message } | Where-Object { $_ -match '\[dealer-auth\]' } | Select-Object -Last 10)
          if (-not $messages.Count) { throw 'No recent dealer authentication log entry was found.' }
          foreach ($message in $messages) {
            $safeMessage = $message -replace '(?i)(token|secret|authorization)\s*[=:]\s*[^,}\s]+', '$1=[redacted]'
            Write-Output $safeMessage
          }
