name: Deploy managed bank debit accounts v629

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECR_REPOSITORY: salon-de-lien-staging-app
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  RELEASE_DIR: scripts/aws/runtime-patches/managed-bank-debit-accounts-v629
  PARENT_DIGEST: sha256:d038b7ddd8c75d3c8746ef7152a03728b1e5d204462b920aa2914ccab9d40be8

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify protected automation identity
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected AWS deployment identity.' }

      - name: Validate managed account release
        shell: pwsh
        run: |
          foreach ($file in @('managed-account-access-v629.js', 'dealer-login-v629.fragment.js', 'migrate-existing-billing.mjs', 'migration-fixture.mjs', 'patch-runtime.mjs', 'verify-runtime.mjs', 'local-fixture.mjs', 'browser-regression.mjs', 'production-smoke.mjs')) {
            node --check (Join-Path $env:RELEASE_DIR $file)
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $file" }
          }
          node (Join-Path $env:RELEASE_DIR 'local-fixture.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Managed account data fixture failed.' }
          node (Join-Path $env:RELEASE_DIR 'migration-fixture.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Bank debit migration fixture failed.' }

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install the pinned registry export tool
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
        with:
          version: v0.22.1

      - name: Resolve and lock the currently running release
        shell: pwsh
        run: |
          $task = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          $definition = aws ecs describe-task-definition --task-definition $task --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          $image = ([string]$web.image).Trim()
          if (-not $task -or -not $image) { throw 'Current ECS release could not be resolved.' }
          if ($image -match '@(sha256:[a-f0-9]{64})$') { $digest = $Matches[1] } else {
            $currentTag = $image.Substring($image.LastIndexOf(':') + 1)
            $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$currentTag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          }
          if ($digest -ne $env:PARENT_DIGEST) { throw "Production moved from the reviewed parent image. Expected $($env:PARENT_DIGEST), found $digest." }
          "PREVIOUS_TASK=$task" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_IMAGE=$image" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_DIGEST=$digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, test, and push immutable child image
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $tag = "managed-bank-debit-accounts-v629-$shortSha"
          $registry = "$($env:AWS_ACCOUNT_ID).dkr.ecr.$($env:AWS_REGION).amazonaws.com"
          $image = "$registry/$($env:ECR_REPOSITORY):$tag"
          $baseImage = "$registry/$($env:ECR_REPOSITORY)@$($env:PARENT_DIGEST)"
          $rootfs = Join-Path $env:RUNNER_TEMP 'salon-v629-rootfs.tar'
          $flatBase = "salon-de-lien-v629-flat:$shortSha"
          crane export $baseImage $rootfs
          if ($LASTEXITCODE -ne 0) { throw 'Base image export failed.' }
          docker import `
            --change 'USER nextjs' `
            --change 'ENV PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' `
            --change 'ENV NODE_VERSION=20.20.2' `
            --change 'ENV YARN_VERSION=1.22.22' `
            --change 'ENV NODE_ENV=production' `
            --change 'ENV NEXT_TELEMETRY_DISABLED=1' `
            --change 'WORKDIR /app' `
            --change 'ENTRYPOINT ["lien-entrypoint"]' `
            --change 'CMD ["node","server.js"]' `
            $rootfs $flatBase | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Flattened base image import failed.' }
          docker build --build-arg "BASE_IMAGE=$flatBase" --tag $image $env:RELEASE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Docker build failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v629/verify-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime isolation verification failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v629/local-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Containerized managed account fixture failed.' }
          docker run --rm --entrypoint node $image /tmp/lien-v629/migration-fixture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Containerized billing migration fixture failed.' }
          docker push $image
          if ($LASTEXITCODE -ne 0) { throw 'ECR push failed.' }
          $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$tag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if (-not $digest -or $digest -eq 'None') { throw 'Release digest was not resolved.' }
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_IMAGE=$image" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DIGEST=$digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Chromium verification
        shell: pwsh
        run: |
          $chrome = @('/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'A Chromium executable is required for the browser tests.' }
          $browserDependencies = Join-Path $env:RUNNER_TEMP 'lien-browser-smoke-v629'
          npm install --prefix $browserDependencies --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed.' }
          "SMOKE_DEPENDENCIES_PACKAGE=$(Join-Path $browserDependencies 'node_modules/playwright-core/package.json')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CHROME_PATH=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify account issuance layout before deployment
        shell: pwsh
        run: |
          $env:SCREENSHOT_DIR = 'artifacts/managed-bank-debit-accounts-v629/local'
          node (Join-Path $env:RELEASE_DIR 'browser-regression.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Managed account layout verification failed.' }

      - name: Register application task definition
        shell: pwsh
        run: |
          $newTask = (& ./scripts/aws/register-release-task.ps1 -CurrentTaskDefinition $env:PREVIOUS_TASK -Image $env:RELEASE_IMAGE -Profile '' | Select-Object -Last 1).Trim()
          if (-not $newTask) { throw 'Release task definition was not registered.' }
          "RELEASE_TASK=$newTask" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Approve and deploy with automatic rollback
        shell: pwsh
        run: |
          & ./scripts/aws/approve-and-deploy-protected-release.ps1 -PreviousTaskDefinitionArn $env:PREVIOUS_TASK -PreviousImage $env:PREVIOUS_IMAGE -PreviousImageDigest $env:PREVIOUS_DIGEST -NewTaskDefinitionArn $env:RELEASE_TASK -NewImage $env:RELEASE_IMAGE -NewImageDigest $env:RELEASE_DIGEST -Profile ''

      - name: Migrate existing test subscriptions to bank debit
        shell: pwsh
        run: |
          $networkJson = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].networkConfiguration' --output json --no-cli-pager) -join "`n"
          if (-not $networkJson) { throw 'Service network configuration could not be resolved.' }
          $networkPath = Join-Path $env:RUNNER_TEMP 'v629-network.json'
          $overridesPath = Join-Path $env:RUNNER_TEMP 'v629-migration-overrides.json'
          [IO.File]::WriteAllText($networkPath, $networkJson, [Text.UTF8Encoding]::new($false))
          $overrides = @{ containerOverrides = @(@{ name = 'Web'; command = @('node', '/tmp/lien-v629/migrate-existing-billing.mjs') }) } | ConvertTo-Json -Compress -Depth 8
          [IO.File]::WriteAllText($overridesPath, $overrides, [Text.UTF8Encoding]::new($false))
          $result = aws ecs run-task --cluster $env:ECS_CLUSTER --task-definition $env:RELEASE_TASK --launch-type FARGATE --network-configuration "file://$networkPath" --overrides "file://$overridesPath" --started-by managed-bank-debit-v629 --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          if (@($result.failures).Count) { throw ('Billing migration task failed to start: ' + ($result.failures | ConvertTo-Json -Compress)) }
          $taskArn = [string]$result.tasks[0].taskArn
          if (-not $taskArn) { throw 'Billing migration task ARN was not returned.' }
          $taskId = $taskArn.Split('/')[-1]
          aws ecs wait tasks-stopped --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --no-cli-pager
          if ($LASTEXITCODE -ne 0) { throw 'Timed out waiting for the billing migration task.' }
          $task = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($task.tasks[0].containers | Where-Object { $_.name -eq 'Web' })[0]
          $logStream = "nextjs/Web/$taskId"
          $messages = @()
          for ($attempt = 1; $attempt -le 12; $attempt += 1) {
            try {
              $messages = @(aws logs get-log-events --log-group-name '/ecs/salon-de-lien-staging/web' --log-stream-name $logStream --region $env:AWS_REGION --query 'events[].message' --output text --no-cli-pager)
              if (($messages -join "`n") -match 'V629_BANK_DEBIT_MIGRATION=') { break }
            } catch {}
            Start-Sleep -Seconds 5
          }
          $messages | ForEach-Object { Write-Host $_ }
          if ([int]$web.exitCode -ne 0) { throw "Billing migration task exited with code $($web.exitCode)." }
          if (($messages -join "`n") -notmatch 'V629_BANK_DEBIT_MIGRATION=.*"paymentMethod":"bank_debit"') { throw 'Billing migration completion marker was not found.' }

      - name: Verify managed bank debit accounts in production
        shell: pwsh
        run: |
          $required = [ordered]@{
            'X-Lien-Managed-Bank-Accounts' = 'v629'
            'X-Lien-List-Pagination' = 'v628'
            'X-Lien-Password-Visibility' = 'v627'
            'X-Lien-Style-Detail-Cleanup' = 'v626'
            'X-Lien-Style-Admin-Post-Controls' = 'v625'
            'X-Lien-Navigation-Loader-Verified' = 'v624'
            'X-Lien-Navigation-Loader-Scope' = 'v623'
            'X-Lien-Auto-Split-Orders' = 'v622'
            'X-Lien-All-Dealer-Order-Filter' = 'v621'
            'X-Lien-Dealer-Code-History' = 'v620'
            'X-Lien-Style-Admin-Rerender' = 'v619'
            'X-Lien-Style-Admin-Controls' = 'v618'
            'X-Lien-Stamp-Card-Commercial' = 'v617'
            'X-Lien-Customer-Booking-Confirmation' = 'v616'
            'X-Lien-Style-Publisher-Comments' = 'v615'
            'X-Lien-Customer-Current-Appointment' = 'v614'
            'X-Lien-Coupon-Email-Delivery' = 'v613'
            'X-Lien-Hotpepper-Menu-Import' = 'v612'
            'X-Lien-Style-Community-Rerender' = 'v611'
            'X-Lien-Style-Community-Controls' = 'v610'
            'X-Lien-Hotpepper-Style-Import' = 'v600'
            'X-Lien-Business-Logout' = 'v599'
            'X-Lien-Customer-Notification-Badge' = 'v597'
            'X-Lien-Customer-Store-List' = 'v595'
            'X-Lien-Daily-Sales-Print' = 'v590'
            'X-Lien-Receipt-Pos-Direct' = 'v582'
          }
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt += 1) {
            try {
              $response = Invoke-WebRequest -Uri 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 10 -UseBasicParsing
              $ready = $response.StatusCode -eq 200
              foreach ($entry in $required.GetEnumerator()) {
                if ($response.Headers[$entry.Key] -ne $entry.Value) { $ready = $false; break }
              }
              if ($ready) { break }
            } catch { $ready = $false }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Production readiness did not recover on managed bank debit accounts v629.' }
          $env:SMOKE_BASE_URL = 'https://salon-de-lien.com'
          $env:SCREENSHOT_DIR = 'artifacts/managed-bank-debit-accounts-v629/production'
          node (Join-Path $env:RELEASE_DIR 'production-smoke.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production managed account browser test failed.' }
          $actualTask = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          if ($actualTask -ne $env:RELEASE_TASK) { throw 'ECS did not settle on the approved release.' }

      - name: Record approved release lock
        shell: pwsh
        run: |
          $lockPath = 'infrastructure/deployment-protection/staging-lock.json'
          $lock = Get-Content -Raw $lockPath | ConvertFrom-Json
          $lock.taskDefinitionArn = $env:RELEASE_TASK
          $lock.imageUri = $env:RELEASE_IMAGE
          $lock.imageDigest = $env:RELEASE_DIGEST
          $lock.canonicalCommit = $env:GITHUB_SHA
          $lock.runtimePatchId = $env:RELEASE_TAG
          [IO.File]::WriteAllText((Resolve-Path $lockPath), ($lock | ConvertTo-Json -Depth 20) + "`n", [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lockPath
          git commit -m 'chore: record protected runtime release [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"

      - name: Preserve browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-bank-debit-accounts-v629
          path: artifacts/managed-bank-debit-accounts-v629/
          if-no-files-found: ignore
