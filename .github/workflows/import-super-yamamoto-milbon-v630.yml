name: Import Super Yamamoto Milbon catalog v630

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECR_REPOSITORY: salon-de-lien-staging-app
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  IMPORT_DIR: scripts/aws/data-imports/super-yamamoto-milbon-v630
  BASE_DIGEST: sha256:6d0dd3f16159d6db83c99504d1842ec5c0032c1ae8d4306d2c63c3b2ec12116e
  IMPORT_IMAGE: 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:super-yamamoto-milbon-v630-af59d53
  IMPORT_DIGEST: sha256:432e3a051a92aa4d01da2012721b0906bd7868aa6ba3ef8107e14920a987f7d9

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify protected automation identity
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected AWS deployment identity.' }

      - name: Validate the committed importer
        shell: pwsh
        run: |
          foreach ($file in @('catalog-common.mjs', 'extract-catalog.mjs', 'import-catalog.mjs', 'audit-catalog.mjs', 'local-fixture.mjs')) {
            node --check (Join-Path $env:IMPORT_DIR $file)
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $file" }
          }
          node (Join-Path $env:IMPORT_DIR 'local-fixture.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Importer fixture validation failed.' }

      - name: Lock the production release and importer image
        shell: pwsh
        run: |
          $service = aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $task = ([string]$service.services[0].taskDefinition).Trim()
          $definition = aws ecs describe-task-definition --task-definition $task --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          $image = ([string]$web.image).Trim()
          if (-not $task -or -not $image) { throw 'Current ECS release could not be resolved.' }
          if ($image -match '@(sha256:[a-f0-9]{64})$') {
            $digest = $Matches[1]
          } else {
            $currentTag = $image.Substring($image.LastIndexOf(':') + 1)
            $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$currentTag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          }
          if ($digest -ne $env:BASE_DIGEST) { throw "Production moved from the reviewed image. Expected $($env:BASE_DIGEST), found $digest." }

          $importTag = $env:IMPORT_IMAGE.Substring($env:IMPORT_IMAGE.LastIndexOf(':') + 1)
          $importDigest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$importTag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if ($importDigest -ne $env:IMPORT_DIGEST) { throw "Importer image digest mismatch. Expected $($env:IMPORT_DIGEST), found $importDigest." }

          $networkPath = Join-Path $env:RUNNER_TEMP 'milbon-v630-network.json'
          [IO.File]::WriteAllText($networkPath, ($service.services[0].networkConfiguration | ConvertTo-Json -Depth 20 -Compress), [Text.UTF8Encoding]::new($false))
          "PREVIOUS_TASK=$task" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PREVIOUS_IMAGE=$image" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NETWORK_PATH=$networkPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Register the transient importer task
        shell: pwsh
        run: |
          $task = (& ./scripts/aws/register-release-task.ps1 -CurrentTaskDefinition $env:PREVIOUS_TASK -Image $env:IMPORT_IMAGE -Profile '' | Select-Object -Last 1).Trim()
          if (-not $task) { throw 'Transient importer task definition was not registered.' }
          "IMPORT_TASK=$task" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import the Milbon catalog
        shell: pwsh
        run: |
          $overridesPath = Join-Path $env:RUNNER_TEMP 'milbon-v630-import-overrides.json'
          $overrides = @{ containerOverrides = @(@{ name = 'Web'; command = @('node', '/tmp/lien-v630/import-catalog.mjs') }) }
          [IO.File]::WriteAllText($overridesPath, ($overrides | ConvertTo-Json -Depth 20 -Compress), [Text.UTF8Encoding]::new($false))
          $run = aws ecs run-task --cluster $env:ECS_CLUSTER --launch-type FARGATE --task-definition $env:IMPORT_TASK --network-configuration "file://$($env:NETWORK_PATH)" --overrides "file://$overridesPath" --started-by super-yamamoto-milbon-v630-import --count 1 --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($run.failures).Count -gt 0 -or @($run.tasks).Count -ne 1) { throw 'The Milbon import task could not be started.' }
          $taskArn = [string]$run.tasks[0].taskArn
          aws ecs wait tasks-stopped --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --no-cli-pager
          if ($LASTEXITCODE -ne 0) { throw 'Timed out waiting for the Milbon import task.' }
          $description = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $task = $description.tasks[0]
          $web = @($task.containers | Where-Object { $_.name -eq 'Web' })[0]
          if ($null -eq $web.exitCode -or [int]$web.exitCode -ne 0) { throw "Milbon import failed: exit=$($web.exitCode), reason=$($web.reason), stopped=$($task.stoppedReason)" }
          Write-Host "Milbon import task completed: $taskArn"

      - name: Independently audit the imported catalog
        shell: pwsh
        run: |
          $overridesPath = Join-Path $env:RUNNER_TEMP 'milbon-v630-audit-overrides.json'
          $overrides = @{ containerOverrides = @(@{ name = 'Web'; command = @('node', '/tmp/lien-v630/audit-catalog.mjs') }) }
          [IO.File]::WriteAllText($overridesPath, ($overrides | ConvertTo-Json -Depth 20 -Compress), [Text.UTF8Encoding]::new($false))
          $run = aws ecs run-task --cluster $env:ECS_CLUSTER --launch-type FARGATE --task-definition $env:IMPORT_TASK --network-configuration "file://$($env:NETWORK_PATH)" --overrides "file://$overridesPath" --started-by super-yamamoto-milbon-v630-audit --count 1 --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($run.failures).Count -gt 0 -or @($run.tasks).Count -ne 1) { throw 'The independent catalog audit task could not be started.' }
          $taskArn = [string]$run.tasks[0].taskArn
          aws ecs wait tasks-stopped --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --no-cli-pager
          if ($LASTEXITCODE -ne 0) { throw 'Timed out waiting for the independent catalog audit.' }
          $description = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $task = $description.tasks[0]
          $web = @($task.containers | Where-Object { $_.name -eq 'Web' })[0]
          if ($null -eq $web.exitCode -or [int]$web.exitCode -ne 0) { throw "Independent catalog audit failed: exit=$($web.exitCode), reason=$($web.reason), stopped=$($task.stoppedReason)" }
          Write-Host "Independent catalog audit completed: $taskArn"

      - name: Verify the web service remained unchanged
        shell: pwsh
        run: |
          $service = aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $actualTask = ([string]$service.services[0].taskDefinition).Trim()
          if ($actualTask -ne $env:PREVIOUS_TASK) { throw "The web service task definition changed unexpectedly: $actualTask" }

          $taskText = (& aws ecs list-tasks --cluster $env:ECS_CLUSTER --service-name $env:ECS_SERVICE --desired-status RUNNING --region $env:AWS_REGION --query 'taskArns' --output text --no-cli-pager).Trim()
          $taskArns = @($taskText -split '\s+' | Where-Object { $_ -and $_ -ne 'None' })
          if ($taskArns.Count -eq 0) { throw 'No running web service tasks were found.' }
          $description = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArns --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $digests = @($description.tasks | ForEach-Object { (@($_.containers | Where-Object { $_.name -eq 'Web' })[0]).imageDigest })
          if ($digests.Count -eq 0 -or @($digests | Where-Object { $_ -ne $env:BASE_DIGEST }).Count -gt 0) { throw "Unexpected running web image digest: $($digests -join ', ')" }

          $response = Invoke-WebRequest -Uri 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 15 -UseBasicParsing
          if ($response.StatusCode -ne 200 -or $response.Headers['X-Lien-Managed-Bank-Accounts'] -ne 'v629') { throw 'Production readiness verification failed after the data import.' }
          Write-Host "Web service unchanged on $actualTask with digest $($env:BASE_DIGEST)."
