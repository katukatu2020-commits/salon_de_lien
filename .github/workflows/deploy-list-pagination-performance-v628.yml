name: Finalize customer store limit v642

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECR_REPOSITORY: salon-de-lien-staging-app
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  RELEASE_DIR: scripts/aws/runtime-patches/customer-store-limit-v642
  RELEASE_COMMIT: 0b0599063628d9e9d5a2b79f06139a3510779ae2
  RELEASE_TAG: customer-store-limit-v642-0b0599063628
  RELEASE_IMAGE: 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:customer-store-limit-v642-0b0599063628
  RELEASE_DIGEST: sha256:b9c9454dca44771df4e9662a49a56aa293fedcf6ae23b9374a208bfdf557a970
  RELEASE_TASK: arn:aws:ecs:ap-northeast-1:009293460979:task-definition/salon-de-lien-staging-web:650

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployed customer store limit release
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected AWS deployment identity.' }
          $required = [ordered]@{
            'X-Lien-Customer-Store-Limit' = 'v642'
            'X-Lien-Search-Input-Stability' = 'v641'
            'X-Lien-Style-List-Performance' = 'v640'
            'X-Lien-Customer-Profile-Name-Fields' = 'v636'
            'X-Lien-Customer-Store-List' = 'v595'
            'X-Lien-Customer-Store-Session' = 'v591'
            'X-Lien-Password-Visibility' = 'v627'
          }
          $ready = $false
          for ($attempt = 1; $attempt -le 12; $attempt += 1) {
            try {
              $response = Invoke-WebRequest -Uri 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 10 -UseBasicParsing
              $ready = $response.StatusCode -eq 200
              foreach ($entry in $required.GetEnumerator()) {
                if ($response.Headers[$entry.Key] -ne $entry.Value) { $ready = $false; break }
              }
              if ($ready) { break }
            } catch { $ready = $false }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'Production is not serving customer store limit v642.' }
          $env:SMOKE_BASE_URL = 'https://salon-de-lien.com'
          node (Join-Path $env:RELEASE_DIR 'production-smoke.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production customer store smoke test failed.' }
          $service = aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $current = @($service.services)[0]
          if ($current.taskDefinition -ne $env:RELEASE_TASK) { throw "Unexpected running task: $($current.taskDefinition)" }
          if ($current.desiredCount -ne 1 -or $current.runningCount -ne 1 -or $current.pendingCount -ne 0) { throw 'ECS service is not stable.' }
          $definition = aws ecs describe-task-definition --task-definition $current.taskDefinition --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $image = [string](@($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0].image)
          if ($image -ne $env:RELEASE_IMAGE) { throw "Unexpected running image: $image" }
          $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$($env:RELEASE_TAG)" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if ($digest -ne $env:RELEASE_DIGEST) { throw "Unexpected release digest: $digest" }

      - name: Record approved release lock
        shell: pwsh
        run: |
          $lockPath = 'infrastructure/deployment-protection/staging-lock.json'
          $lock = Get-Content -Raw $lockPath | ConvertFrom-Json
          $lock.taskDefinitionArn = $env:RELEASE_TASK
          $lock.imageUri = $env:RELEASE_IMAGE
          $lock.imageDigest = $env:RELEASE_DIGEST
          $lock.canonicalCommit = $env:RELEASE_COMMIT
          $lock.runtimePatchId = $env:RELEASE_TAG
          [IO.File]::WriteAllText((Resolve-Path $lockPath), ($lock | ConvertTo-Json -Depth 20) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lockPath
          git commit -m 'chore: record protected runtime release [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"
