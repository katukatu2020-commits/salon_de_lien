name: Finalize style detail loading recovery v639

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-protected-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECR_REPOSITORY: salon-de-lien-staging-app
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web
  RELEASE_DIR: scripts/aws/runtime-patches/style-detail-loading-recovery-v639
  EXPECTED_TASK: arn:aws:ecs:ap-northeast-1:009293460979:task-definition/salon-de-lien-staging-web:645
  EXPECTED_IMAGE: 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:style-detail-loading-recovery-v639-17348b211a37
  EXPECTED_DIGEST: sha256:a96c4c23867ea3cb187a68059550b4bc82def683993dcbe2d5a3a4803ee33086
  EXPECTED_COMMIT: 17348b211a37e493b5ae3d264b4318c96fa2d5c8

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployed release identity
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') { throw 'Unexpected AWS deployment identity.' }
          $task = (aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --query 'services[0].taskDefinition' --output text --no-cli-pager).Trim()
          if ($task -ne $env:EXPECTED_TASK) { throw "Production task changed. Expected $($env:EXPECTED_TASK), found $task." }
          $definition = aws ecs describe-task-definition --task-definition $task --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $web = @($definition.taskDefinition.containerDefinitions | Where-Object { $_.name -eq 'Web' })[0]
          $image = ([string]$web.image).Trim()
          if ($image -ne $env:EXPECTED_IMAGE) { throw "Production image changed. Expected $($env:EXPECTED_IMAGE), found $image." }
          $tag = $image.Substring($image.LastIndexOf(':') + 1)
          $digest = (aws ecr describe-images --repository-name $env:ECR_REPOSITORY --image-ids "imageTag=$tag" --region $env:AWS_REGION --query 'imageDetails[0].imageDigest' --output text --no-cli-pager).Trim()
          if ($digest -ne $env:EXPECTED_DIGEST) { throw "Production digest changed. Expected $($env:EXPECTED_DIGEST), found $digest." }

      - name: Verify style detail recovery in production
        shell: pwsh
        run: |
          foreach ($file in @('production-browser.mjs', 'production-smoke.mjs')) {
            node --check (Join-Path $env:RELEASE_DIR $file)
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $file" }
          }
          $required = [ordered]@{
            'X-Lien-Style-Detail-Loading-Recovery' = 'v639'
            'X-Lien-Dealer-Pricing-Ime-Search' = 'v638'
            'X-Lien-Business-Inquiries' = 'v637'
            'X-Lien-Customer-Profile-Name-Fields' = 'v636'
            'X-Lien-Booking-Confirmation-Name' = 'v635'
            'X-Lien-Style-Demo-Ordering' = 'v634'
            'X-Lien-Customer-Registration-Name-Fields' = 'v633'
            'X-Lien-Salon-Onboarding-Guides' = 'removed-v632'
            'X-Lien-Dealer-Pricing-Pagination' = 'v631'
            'X-Lien-Managed-Bank-Accounts' = 'v629'
            'X-Lien-List-Pagination' = 'v628'
            'X-Lien-Password-Visibility' = 'v627'
          }
          $response = Invoke-WebRequest -Uri 'https://salon-de-lien.com/api/health/ready' -TimeoutSec 15 -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw 'Production readiness endpoint is unavailable.' }
          foreach ($entry in $required.GetEnumerator()) {
            if ($response.Headers[$entry.Key] -ne $entry.Value) { throw "Readiness marker mismatch: $($entry.Key)" }
          }
          $env:SMOKE_BASE_URL = 'https://salon-de-lien.com'
          node (Join-Path $env:RELEASE_DIR 'production-smoke.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production style detail smoke test failed.' }
          $chrome = @('/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'A Chromium executable is required for browser tests.' }
          $browserDependencies = Join-Path $env:RUNNER_TEMP 'lien-browser-smoke-v639-finalize'
          npm install --prefix $browserDependencies --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency installation failed.' }
          $env:SMOKE_DEPENDENCIES_PACKAGE = Join-Path $browserDependencies 'package.json'
          $env:CHROME_PATH = $chrome
          $env:SCREENSHOT_DIR = 'artifacts/style-detail-loading-recovery-v639/production-final'
          node (Join-Path $env:RELEASE_DIR 'production-browser.mjs')
          if ($LASTEXITCODE -ne 0) { throw 'Production style detail browser test failed.' }

      - name: Record approved release lock
        shell: pwsh
        run: |
          $lockPath = 'infrastructure/deployment-protection/staging-lock.json'
          $lock = Get-Content -Raw $lockPath | ConvertFrom-Json
          $lock.taskDefinitionArn = $env:EXPECTED_TASK
          $lock.imageUri = $env:EXPECTED_IMAGE
          $lock.imageDigest = $env:EXPECTED_DIGEST
          $lock.canonicalCommit = $env:EXPECTED_COMMIT
          $lock.runtimePatchId = 'style-detail-loading-recovery-v639-17348b211a37'
          [IO.File]::WriteAllText((Resolve-Path $lockPath), ($lock | ConvertTo-Json -Depth 20) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $lockPath
          git commit -m 'chore: record protected runtime release [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"

      - name: Preserve verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-detail-loading-recovery-v639-final
          path: artifacts/style-detail-loading-recovery-v639/
          if-no-files-found: ignore
