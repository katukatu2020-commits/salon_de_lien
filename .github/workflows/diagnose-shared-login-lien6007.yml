name: Diagnose shared login lien6007

on:
  push:
    branches:
      - recovery/aws-canonical-20260815
    paths:
      - .github/workflows/diagnose-shared-login-lien6007.yml

permissions:
  contents: write
  id-token: write

concurrency:
  group: salon-de-lien-shared-login-diagnostic
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "009293460979"
  ECS_CLUSTER: salon-de-lien-staging-cluster
  ECS_SERVICE: salon-de-lien-staging-web

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the canonical release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009293460979:role/SalonDeLienGitHubDeployRole
          role-session-name: GitHubActionsSharedLoginDiagnostic
          aws-region: ${{ env.AWS_REGION }}

      - name: Classify the reserved identifier without reading account details
        id: classify
        shell: pwsh
        run: |
          $identity = aws sts get-caller-identity --output json --no-cli-pager | ConvertFrom-Json
          if ($identity.Account -ne $env:AWS_ACCOUNT_ID -or $identity.Arn -notmatch ':assumed-role/SalonDeLienGitHubDeployRole/') {
            throw 'Unexpected AWS diagnostic identity.'
          }

          $service = aws ecs describe-services --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $taskDefinition = [string]$service.services[0].taskDefinition
          $network = $service.services[0].networkConfiguration.awsvpcConfiguration
          if (-not $taskDefinition -or -not $network) { throw 'Current ECS task or network configuration was not resolved.' }

          $networkJson = @{
            awsvpcConfiguration = @{
              subnets = @($network.subnets)
              securityGroups = @($network.securityGroups)
              assignPublicIp = [string]$network.assignPublicIp
            }
          } | ConvertTo-Json -Depth 8 -Compress

          $diagnosticScript = @'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const value = 'lien6007';
            const currentRows = await prisma.$queryRawUnsafe(
              `SELECT u."organizationId",o."name"
               FROM "AppUser" u JOIN "Organization" o ON o."id"=u."organizationId"
               WHERE u."isSharedStoreAccount"=TRUE AND u."active"=TRUE
                 AND LOWER(COALESCE(u."loginId",''))='lien94446007'
               LIMIT 1`,
            );
            if (!currentRows[0]?.organizationId) {
              await prisma.$disconnect();
              process.exit(254);
            }
            const targetOrganization = String(currentRows[0].organizationId);
            const rows = await prisma.$queryRawUnsafe(
              `SELECT u."organizationId",u."passwordHash" IS NOT NULL AS "hasPassword",u."updatedAt",o."name"
               FROM "AppUser" u JOIN "Organization" o ON o."id"=u."organizationId"
               WHERE u."active"=TRUE AND u."isSharedStoreAccount"=TRUE
                 AND LOWER(COALESCE(u."loginId",''))=$1`,
              value,
            );
            if (rows.length !== 1) {
              await prisma.$disconnect();
              process.exit(253);
            }
            const collision = rows[0];
            const collisionOrganization = String(collision.organizationId || '');
            const stats = await prisma.$queryRawUnsafe(
              `SELECT
                 (SELECT COUNT(*)::int FROM "AppUser" WHERE "organizationId"=$1 AND "role"='ADMIN' AND "active"=TRUE) AS "activeAdmins",
                 (SELECT COUNT(*)::int FROM "Customer" WHERE "organizationId"=$1 AND "deletedAt" IS NULL) AS "customers",
                 (SELECT COUNT(*)::int FROM "Appointment" a JOIN "Customer" c ON c."id"=a."customerId" WHERE c."organizationId"=$1) AS "appointments",
                 (SELECT COUNT(*)::int FROM "ServiceSale" s JOIN "Customer" c ON c."id"=s."customerId" WHERE c."organizationId"=$1) AS "sales",
                 (SELECT COUNT(*)::int FROM "Customer" WHERE "organizationId"=$2 AND "deletedAt" IS NULL) AS "currentCustomers",
                 (SELECT COUNT(*)::int FROM "Appointment" a JOIN "Customer" c ON c."id"=a."customerId" WHERE c."organizationId"=$2) AS "currentAppointments",
                 (SELECT COUNT(*)::int FROM "ServiceSale" s JOIN "Customer" c ON c."id"=s."customerId" WHERE c."organizationId"=$2) AS "currentSales",
                 (SELECT COUNT(*)::int FROM "OrganizationBilling" WHERE "organizationId"=$1 AND "subscriptionStatus" NOT IN ('none','canceled','incomplete_expired')) AS "liveBilling"`,
              collisionOrganization,
              targetOrganization,
            );
            const summary = stats[0] || {};
            const normalizedName = input => String(input || '').normalize('NFKC').replace(/\s+/g, '').toLowerCase();
            const collisionHasBusinessData = Number(summary.customers || 0) + Number(summary.appointments || 0) + Number(summary.sales || 0) > 0;
            const currentHasBusinessData = Number(summary.currentCustomers || 0) + Number(summary.currentAppointments || 0) + Number(summary.currentSales || 0) > 0;
            let mask = 0;
            if (collisionOrganization === (process.env.DEFAULT_ORGANIZATION_ID || 'org_salon_de_lien')) mask |= 1;
            if (normalizedName(collision.name) === normalizedName(currentRows[0].name)) mask |= 2;
            if (collision.hasPassword) mask |= 4;
            if (Number(summary.activeAdmins || 0) > 0) mask |= 8;
            if (collisionHasBusinessData) mask |= 16;
            if (currentHasBusinessData) mask |= 32;
            if (Number(summary.liveBilling || 0) > 0) mask |= 64;
            if (Date.now() - new Date(collision.updatedAt).getTime() < 30 * 24 * 60 * 60 * 1000) mask |= 128;
            await prisma.$disconnect();
            process.exit(mask);
          })().catch(async () => {
            await prisma.$disconnect().catch(() => {});
            process.exit(255);
          });
          '@
          $encodedScript = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($diagnosticScript))
          $command = "eval(Buffer.from('$encodedScript','base64').toString('utf8'))"
          $overridesJson = @{ containerOverrides = @(@{ name = 'Web'; command = @('node', '-e', $command) }) } | ConvertTo-Json -Depth 8 -Compress

          $run = aws ecs run-task --cluster $env:ECS_CLUSTER --task-definition $taskDefinition --launch-type FARGATE --network-configuration $networkJson --overrides $overridesJson --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $taskArn = [string]$run.tasks[0].taskArn
          if (-not $taskArn) { throw "Diagnostic task did not start: $($run.failures | ConvertTo-Json -Compress)" }

          aws ecs wait tasks-stopped --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --no-cli-pager
          $stopped = aws ecs describe-tasks --cluster $env:ECS_CLUSTER --tasks $taskArn --region $env:AWS_REGION --output json --no-cli-pager | ConvertFrom-Json
          $container = $stopped.tasks[0].containers | Where-Object { $_.name -eq 'Web' } | Select-Object -First 1
          $mask = [int]$container.exitCode
          if ($mask -eq 255) { throw 'The read-only identifier classification query failed.' }
          if ($mask -eq 254) { throw 'The current shared account could not be identified.' }
          if ($mask -eq 253) { throw 'The identifier matched more than one backoffice row.' }

          $result = [ordered]@{
            checkedIdentifier = 'lien6007'
            lifecycleMask = $mask
            collisionIsDefaultOrganization = [bool]($mask -band 1)
            sameNormalizedStoreName = [bool]($mask -band 2)
            collisionAccountHasPassword = [bool]($mask -band 4)
            collisionStoreHasActiveOwner = [bool]($mask -band 8)
            collisionStoreHasBusinessData = [bool]($mask -band 16)
            currentStoreHasBusinessData = [bool]($mask -band 32)
            collisionStoreHasLiveBilling = [bool]($mask -band 64)
            collisionAccountUpdatedWithin30Days = [bool]($mask -band 128)
          }
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'diagnostics/shared-login-lien6007.json'), ($result | ConvertTo-Json) + "`n", [Text.UTF8Encoding]::new($false))

      - name: Record sanitized diagnostic result
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/shared-login-lien6007.json
          git commit -m 'chore: record shared login identifier classification [skip ci]'
          git push origin "HEAD:$($env:GITHUB_REF_NAME)"
