services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon_de_lien"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app@sha256:acf611073379c35d7383a71f3dc541509ef87b21da53092aa199d985102ae1c9
    pull_policy: never
    container_name: salon_de_lien_aws_parity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
      APP_ENV: staging
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://salon:salon_password@postgres:5432/salon_de_lien?schema=public
      APP_URL: http://localhost:${LIEN_LOCAL_PORT:-3000}
      NEXT_PUBLIC_APP_URL: http://localhost:${LIEN_LOCAL_PORT:-3000}
      DEFAULT_ORGANIZATION_ID: org_salon_de_lien
      ALLOW_DEMO_DATA: "false"
      ALLOW_LEGACY_CUSTOMER_ID_PORTAL: "false"
      STORAGE_PROVIDER: vercel-blob
      SMS_PROVIDER: console
      SMS_DEV_SHOW_CODE: "true"
      CUSTOMER_SMS_VERIFICATION_ENABLED: "false"
      GMAIL_AUTO_SYNC_ENABLED: "false"
      COMMUNITY_AI_COMMENT_ENABLED: "false"
      ENABLE_STYLE_IMAGE_GENERATION: "false"
      CUSTOMER_COUPON_CODE_ENTRY_ENABLED: "false"
      CUSTOMER_REFERRAL_REWARDS_ENABLED: "false"
      BILLING_ONBOARDING_ENABLED: "false"
    ports:
      - "${LIEN_LOCAL_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
