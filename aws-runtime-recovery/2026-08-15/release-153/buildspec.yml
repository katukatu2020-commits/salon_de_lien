version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com
  build:
    commands:
      - docker build -f Dockerfile.release-136 -t 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:admin-theme-modal-20260815-153 .
  post_build:
    commands:
      - docker push 009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:admin-theme-modal-20260815-153
      - printf '[{"name":"Web","imageUri":"009293460979.dkr.ecr.ap-northeast-1.amazonaws.com/salon-de-lien-staging-app:admin-theme-modal-20260815-153"}]' > imagedefinitions.json

